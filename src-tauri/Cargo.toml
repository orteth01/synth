[package]
name = "synth-tauri"
version = "0.0.0"
description = "Digital Moog-style synth — desktop shell"
authors = ["Synth"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "synth_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
